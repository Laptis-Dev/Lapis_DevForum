<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>·编辑·</title>
    <link rel="stylesheet" href="css/edit.css">
</head>

<body>
    <div class="editor-container">
        <div class="toolbar">
            <button id="bold" title="粗体"><b>B</b></button>
            <button id="italic" title="斜体"><i>I</i></button>
            <button id="underline" title="下划线"><u>U</u></button>
            <button id="strike" title="删除线"><s>S</s></button>
            <button id="undo" title="撤销">↶</button>
            <button id="redo" title="重做">↷</button>
            <button id="insertLink" title="插入链接">🔗</button>
            <button id="insertImage" title="插入图片">🖼</button>
            <button id="save" title="保存">💾(L)</button>
            <button id="saveAs" title="另存为">💾(A)</button>
        </div>
        <div class="editor-wrapper" style="position: relative; min-height: 400px;">
            <div id="background"
                style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 20px; color: #bbb; pointer-events: none;">
                欢迎来到编辑页<br>
                请输入文本...
            </div>
            <div class="editor-content" contenteditable="true" id="editor"
                style="position: relative; background: transparent;"></div>
        </div>
        <div id="wordCount">字数: 0</div>
        <div id="cursorPosition">位置: 0:0</div>
    </div>
    </div>
    <script src="dist/edit.js"></script>
    <script src="dist/listener-back.js"></script>
</body>

</html>
